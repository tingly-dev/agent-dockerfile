name: Build dsh image

on:
  push:
    branches: [main]
    paths: ["deepseek-harness/**", ".github/workflows/build-dsh.yml"]
  pull_request:
    paths: ["deepseek-harness/**", ".github/workflows/build-dsh.yml"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # repo owner, lowercased for GHCR
  IMAGE_NAME: ${{ github.repository }}-dsh

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: deepseek-harness
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # npm mirror default; set NPM_REGISTRY var in repo settings to override
          build-args: |
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || 'https://registry.npmmirror.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
